            - heading "I. Introduction to the Module" [level=2] [ref=e118]
          - generic [ref=e119]:
            - heading "Bimanual Compression of the Uterus — Procedure" [level=3] [ref=e120]
            - generic [ref=e121]:
              - paragraph [ref=e122]: Bimanual compression of the uterus is an emergency measure used in refractory postpartum hemorrhage (PPH) when uterine atony persists despite uterine massage and first-line uterotonics (the MOTIVE/First Response Bundle). It works by physically compressing the uterus between two hands to control bleeding while other resuscitative and pharmacological measures continue.
              - paragraph [ref=e123]: "STEP-BY-STEP PROCEDURE:"
              - list [ref=e124]:
                - listitem [ref=e125]: Shout for help and assemble the emergency team.
                - listitem [ref=e126]: Briefly explain the procedure to the mother and obtain informed consent.
                - listitem [ref=e127]: Perform hand hygiene and put on gynecological (elbow-length) gloves — double-glove.
                - listitem [ref=e128]: Perform a vaginal examination.
                - listitem [ref=e129]: Insert the whole hand into the vagina and, with the hand in the vagina, identify the anterior fornix.
                - listitem [ref=e130]: Form a fist with the internal hand.
                - listitem [ref=e131]: Place the fist into the anterior fornix, pressing it against the anterior wall of the uterus.
                - listitem [ref=e132]: With the other hand on the suprapubic area, press deeply into the abdomen behind the uterus, applying pressure against the posterior wall of the uterus (suprapubic pressure) — the uterus is thereby compressed between the internal fist and the external hand.
                - listitem [ref=e133]: Maintain firm compression for at least 5 minutes, until the bleeding is controlled and the uterus contracts, while continuing with other PPH interventions (uterotonics, IV fluids, blood products as indicated) — do not stop other resuscitative measures while performing this procedure.
                - listitem [ref=e134]: "Reassess: if bleeding is controlled and the uterus is well contracted, gradually release compression while observing for re-bleeding. If bleeding is not controlled, continue compression and escalate (e.g. abdominal aortic compression, uterine balloon tamponade, or transfer for surgical management)."
                - listitem [ref=e135]: Explain to the mother the results of the procedure and next steps, and document blood loss and findings.
              - paragraph [ref=e136]: This is a bridging/temporizing skill — it buys time to organize definitive management (transport, theatre, blood products) and should never delay escalation if bleeding is not controlled.
        - generic [ref=e139]:
          - generic [ref=e140]:
            - img [ref=e142]
            - heading "II. Expected Learning Outcome" [level=2] [ref=e144]
          - paragraph [ref=e146]: By the end of this track, the mentee should be able to independently recognize when bimanual uterine compression is indicated for refractory uterine atony, correctly position both hands (an internal fist in the anterior fornix against the anterior uterine wall, and an external hand compressing the posterior uterine wall suprapubically), sustain compression safely for at least 5 minutes while continuing other first-response PPH interventions, and communicate findings, results, and next steps clearly to the mother and the wider team.
