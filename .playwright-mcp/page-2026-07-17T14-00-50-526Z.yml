            - heading "I. Introduction to the Module" [level=2] [ref=e114]
          - generic [ref=e115]:
            - heading "Bimanual Compression of the Uterus — Procedure" [level=3] [ref=e116]
            - generic [ref=e117]:
              - paragraph [ref=e118]: Bimanual compression of the uterus is an emergency measure used in refractory postpartum hemorrhage (PPH) when uterine atony persists despite uterine massage and first-line uterotonics (the MOTIVE/First Response Bundle). It works by physically compressing the uterus between two hands to control bleeding while other resuscitative and pharmacological measures continue.
              - paragraph [ref=e119]: "STEP-BY-STEP PROCEDURE:"
              - list [ref=e120]:
                - listitem [ref=e121]: Shout for help and assemble the emergency team.
                - listitem [ref=e122]: Briefly explain the procedure to the mother and obtain informed consent.
                - listitem [ref=e123]: Perform hand hygiene and put on gynecological (elbow-length) gloves — double-glove.
                - listitem [ref=e124]: Perform a vaginal examination.
                - listitem [ref=e125]: Insert the whole hand into the vagina and, with the hand in the vagina, identify the anterior fornix.
                - listitem [ref=e126]: Form a fist with the internal hand.
                - listitem [ref=e127]: Place the fist into the anterior fornix, pressing it against the anterior wall of the uterus.
                - listitem [ref=e128]: With the other hand on the suprapubic area, press deeply into the abdomen behind the uterus, applying pressure against the posterior wall of the uterus (suprapubic pressure) — the uterus is thereby compressed between the internal fist and the external hand.
                - listitem [ref=e129]: Maintain firm compression for at least 5 minutes, until the bleeding is controlled and the uterus contracts, while continuing with other PPH interventions (uterotonics, IV fluids, blood products as indicated) — do not stop other resuscitative measures while performing this procedure.
                - listitem [ref=e130]: "Reassess: if bleeding is controlled and the uterus is well contracted, gradually release compression while observing for re-bleeding. If bleeding is not controlled, continue compression and escalate (e.g. abdominal aortic compression, uterine balloon tamponade, or transfer for surgical management)."
                - listitem [ref=e131]: Explain to the mother the results of the procedure and next steps, and document blood loss and findings.
              - paragraph [ref=e132]: This is a bridging/temporizing skill — it buys time to organize definitive management (transport, theatre, blood products) and should never delay escalation if bleeding is not controlled.
          - generic [ref=e133]:
            - heading "Bimanual Compression of the Uterus — Practical Assessment Rubric — Case Scenario" [level=3] [ref=e134]
            - generic [ref=e135]:
              - paragraph [ref=e136]: "SCENARIO: You are managing PPH and you have used all the options available, but the uterus is still not contracted. You have decided to perform a bimanual uterine compression as a remedy."
              - paragraph [ref=e137]: "TASK: Give a running commentary as you perform the procedure."
        - generic [ref=e140]:
