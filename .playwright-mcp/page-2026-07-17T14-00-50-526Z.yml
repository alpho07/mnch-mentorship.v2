            - img [ref=e143]
            - heading "II. Expected Learning Outcome" [level=2] [ref=e145]
          - paragraph [ref=e147]: By the end of this track, the mentee should be able to independently recognize when bimanual uterine compression is indicated for refractory uterine atony, correctly position both hands (an internal fist in the anterior fornix against the anterior uterine wall, and an external hand compressing the posterior uterine wall suprapubically), sustain compression safely for at least 5 minutes while continuing other first-response PPH interventions, and communicate findings, results, and next steps clearly to the mother and the wider team.
